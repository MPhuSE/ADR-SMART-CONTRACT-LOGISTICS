name: Solidity regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - name: Synthetic smoke test
        run: npm run simulate
        env:
          SEED: 42
          NUM_DISPUTES: 20
          OUT: results/ci-smoke
